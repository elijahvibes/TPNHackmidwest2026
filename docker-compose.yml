services:
  # Local Postgres for dev only. In prod we use the Akamai (Linode) Managed Database:
  # set DATABASE_URL in .env and this service is simply not started.
  db:
    image: postgres:16-alpine
    profiles: ["local"]
    environment:
      POSTGRES_USER: trailmix
      POSTGRES_PASSWORD: trailmix
      POSTGRES_DB: trailmix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailmix"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full app image (Go API + built frontend). This is what runs on the Linode.
  #   docker compose --profile prod up -d --build
  # DATABASE_URL comes from .env (Akamai managed DB, sslmode=require).
  app:
    build: .
    profiles: ["prod"]
    env_file: .env
    environment:
      STATIC_DIR: /app/public
      PORT: "8080"
      CORS_ORIGIN: ""
    ports:
      - "80:8080"
    restart: unless-stopped

volumes:
  pgdata:
