services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trailmix
      POSTGRES_PASSWORD: trailmix
      POSTGRES_DB: trailmix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailmix"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full app image (Go API + built frontend). Used on the Linode box.
  # For local dev you usually run `go run ./cmd/api` and `npm run dev` instead.
  app:
    build: .
    profiles: ["prod"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://trailmix:trailmix@db:5432/trailmix?sslmode=disable
      STATIC_DIR: /app/public
      PORT: "8080"
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
