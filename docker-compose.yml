services:
  # Local MySQL for dev only. In prod we use the Akamai (Linode) Managed MySQL
  # database: set DATABASE_URL in .env and this service is simply not started.
  db:
    image: mysql:8.4
    profiles: ["local"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: trailmix
      MYSQL_PASSWORD: trailmix
      MYSQL_DATABASE: trailmix
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utrailmix", "-ptrailmix"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full app image (Go API + built frontend). This is what runs on the Linode.
  #   docker compose --profile prod up -d --build
  # DATABASE_URL comes from .env (Akamai managed DB, sslmode=require).
  app:
    build: .
    profiles: ["prod"]
    env_file: .env
    environment:
      STATIC_DIR: /app/public
      PORT: "8080"
      CORS_ORIGIN: ""
    expose:
      - "8080"
    restart: unless-stopped

  # HTTPS front door. Serves https://<SITE_HOST> with an automatic Let's Encrypt
  # certificate, and plain http on the bare IP. SITE_HOST defaults to the
  # sslip.io name for the server IP, so no DNS is needed to get HTTPS.
  caddy:
    image: caddy:2
    profiles: ["prod"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysqldata:
  caddy_data:
  caddy_config:
